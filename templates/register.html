<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create TRADEON Account</title><style>body{margin:0;font-family:Arial;background:#f5f7fb}.box{max-width:420px;margin:40px auto;background:white;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0001}h1{color:#101828}input{width:100%;padding:14px;margin:8px 0 14px;border:1px solid #d0d5dd;border-radius:10px;box-sizing:border-box}button{width:100%;padding:14px;background:#12b76a;color:white;border:0;border-radius:10px;font-weight:700}.err{color:#b42318;background:#fee4e2;padding:10px;border-radius:8px}.link{text-align:center;margin-top:18px}</style></head><body><div class="box"><h1>Create account</h1><p>Join TRADEON Kenya</p>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="post"><input name="name" placeholder="Full name" required><input name="phone" placeholder="Phone number e.g. 0712345678" required><input name="password" type="password" placeholder="Password (6+ characters)" required><button>Create account</button></form><div class="link">Already have an account? <a href="/login">Log in</a></div></div></body></html>
