<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeOn Manager</title>
<style>body{font-family:Arial;background:#f4f6f8;margin:0}.box{max-width:380px;margin:80px auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 4px 20px #0001}input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box}button{background:#111;color:#fff;border:0;border-radius:8px}.err{color:#b00020}</style><style id="tradeon-sitewide-background">
html,body{min-height:100%;background:#030712!important}
body{background-image:url('/static/tradeon-background.svg')!important;background-repeat:no-repeat!important;background-position:center center!important;background-size:cover!important;background-attachment:fixed!important}
body:before{content:none!important}
header,.top,.navbar,nav{background:rgba(3,10,22,.78)!important;backdrop-filter:blur(16px);border-color:rgba(41,220,166,.32)!important}
.card,.panel,form,.content,.box,.wrap .card,.below-actions,.open-positions,main,.container{background-color:rgba(6,17,31,.72);border-color:rgba(74,157,192,.34)}
</style>
</head>
<body><div class="box"><h2>TRADEON Manager</h2><p>Secure administrator login</p>{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post"><input name="username" placeholder="Manager username" required><input type="password" name="password" placeholder="Manager password" required><button>Sign in</button></form></div></body></html>
