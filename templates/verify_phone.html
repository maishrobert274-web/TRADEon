<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Phone — TRADEON</title><style>body{margin:0;font-family:Arial;background:#f5f7fb}.box{max-width:420px;margin:60px auto;background:white;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0001}input{width:100%;padding:15px;margin:10px 0 15px;border:1px solid #d0d5dd;border-radius:10px;box-sizing:border-box;text-align:center;font-size:24px;letter-spacing:5px}button{width:100%;padding:15px;background:#12b76a;color:#fff;border:0;border-radius:10px;font-weight:700}.err{color:#b42318;background:#fee4e2;padding:10px;border-radius:8px}</style></head><body><div class="box"><h1>Verify your phone</h1><p>We sent a 6-digit verification code by SMS. Enter it below. The code expires in 5 minutes.</p>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="post"><input name="code" inputmode="numeric" maxlength="6" placeholder="000000" required><button>Verify phone</button></form></div></body></html>
