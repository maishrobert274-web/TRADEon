<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRADEON Kenya</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#101828;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:800}.country{font-size:13px;opacity:.8}main{max-width:900px;margin:auto;padding:22px}
.hero,.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 20px #0000000d;margin-bottom:16px}
h1{margin:0 0 8px;font-size:30px}.muted{color:#667085}.balance{font-size:34px;font-weight:800;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
button,a.btn{border:0;border-radius:12px;padding:14px 10px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;text-align:center}
.primary{background:#12b76a;color:white}.secondary{background:#eef2f6;color:#172033}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logout{color:white;text-decoration:none;background:#344054;padding:9px 12px;border-radius:9px}
.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eaecf0}.row:last-child{border-bottom:0}
@media(max-width:600px){.grid{grid-template-columns:1fr}.balance{font-size:28px}}
</style>
</head>
<body>
<header><div class="logo">TRADEON</div><div class="top"><div class="country">🇰🇪 Kenya • KSh</div><a class="logout" href="/logout">Logout</a></div></header>
<main>
<section class="hero"><div class="muted">Welcome, {{ user_name }}</div><h1>Your TRADEON Dashboard</h1>
<div class="balance">KSh 0.00</div><div class="muted">Available balance</div>
<div class="grid"><a class="btn primary" href="/deposit">Deposit KSh</a><button class="secondary" onclick="alert('Withdrawal will be added after payment integration.')">Withdraw KSh</button><a class="btn secondary" href="/trade">Start Trading</a></div></section>
<section class="card"><h2>Recent activity</h2><div class="row"><span>Account</span><strong>Active</strong></div><div class="row"><span>Balance</span><strong>KSh 0.00</strong></div></section>
</main></body></html>
