<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — TRADEON</title><style>body{margin:0;background:#0b0e11;color:#e8edf2;font-family:Arial,sans-serif}.box{max-width:520px;margin:24px auto;padding:16px}.card{background:#151a21;border:1px solid #29313a;border-radius:12px;padding:20px}label{display:block;margin:16px 0 7px;color:#9aa5b1;font-size:13px}input{box-sizing:border-box;width:100%;padding:13px;background:#0e1319;border:1px solid #35404d;border-radius:8px;color:#fff;font-size:16px}button,.btn{display:inline-block;margin-top:16px;border:0;border-radius:8px;padding:12px 16px;background:#159f6b;color:white;font-weight:800;text-decoration:none}.muted{color:#9aa5b1;font-size:13px}.msg{color:#20c997}.err{color:#ff8c8c}.back{color:#20c997;text-decoration:none}</style></head><body><main class="box"><p><a class="back" href="/trade">Back to trading</a></p><section class="card"><h1>My Profile</h1><p class="muted">Update your name and review your registered details.</p>{% if message %}<p class="msg">{{ message }}</p>{% endif %}{% if error %}<p class="err">{{ error }}</p>{% endif %}<form method="post"><label for="name">Full name</label><input id="name" name="name" value="{{ user_name }}" maxlength="80" required><label>Phone number</label><input value="{{ phone }}" readonly><label>Country</label><input value="{{ country }}" readonly><button type="submit">Save profile</button></form><p><a class="btn" href="/wallet">Open wallet</a></p></section></main></body></html>
