<!doctype html><html lang="en"><head>
<link rel="icon" type="image/svg+xml" href="/static/tradeon-icon.svg"><meta name="theme-color" content="#050b14"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — TRADEON</title><style>body{margin:0;background:#0b0e11;color:#e8edf2;font-family:Arial,sans-serif}.box{max-width:520px;margin:24px auto;padding:16px}.card{background:#151a21;border:1px solid #29313a;border-radius:12px;padding:20px}label{display:block;margin:16px 0 7px;color:#9aa5b1;font-size:13px}input{box-sizing:border-box;width:100%;padding:13px;background:#0e1319;border:1px solid #35404d;border-radius:8px;color:#fff;font-size:16px}button,.btn{display:inline-block;margin-top:16px;border:0;border-radius:8px;padding:12px 16px;background:#159f6b;color:white;font-weight:800;text-decoration:none}.muted{color:#9aa5b1;font-size:13px}.msg{color:#20c997}.err{color:#ff8c8c}.back{color:#20c997;text-decoration:none}/* Shared TRADEON dark-fintech background */
html,body{background-color:#050b14!important}
body{background-image:radial-gradient(ellipse at 82% 12%,rgba(0,108,190,.24) 0,transparent 34%),radial-gradient(ellipse at 8% 58%,rgba(0,210,130,.13) 0,transparent 32%),linear-gradient(135deg,#050912 0%,#081525 48%,#03070d 100%)!important;background-attachment:fixed!important}
header,.top,.navbar{background:rgba(5,12,22,.91)!important;backdrop-filter:blur(14px);border-color:rgba(46,209,160,.22)!important}
main,.container,.card,.panel,form,.content,.box{background-color:rgba(11,19,31,.88)!important;border-color:rgba(93,133,163,.28)!important}
a,button{transition:background-color .15s ease}

</style>
<style id="tradeon-visible-background">
html,body{min-height:100%;background:#030712!important}
body{background-image:url('/static/tradeon-background.svg')!important;background-repeat:no-repeat!important;background-position:center center!important;background-size:cover!important;background-attachment:fixed!important}
body:before{content:none!important}
header,.top,.navbar{background:rgba(3,10,22,.76)!important;backdrop-filter:blur(16px);border-color:rgba(41,220,166,.32)!important}
.card,.panel,form,.content,.box,.wrap .card,.below-actions,.open-positions{background:rgba(6,17,31,.72)!important;border-color:rgba(74,157,192,.34)!important;box-shadow:0 12px 38px rgba(0,0,0,.24)}
</style>
</head><body><main class="box"><p><a class="back" href="/trade">Back to trading</a></p><section class="card"><h1>My Profile</h1><p class="muted">Update your name and review your registered details.</p>{% if message %}<p class="msg">{{ message }}</p>{% endif %}{% if error %}<p class="err">{{ error }}</p>{% endif %}<form method="post"><label for="name">Full name</label><input id="name" name="name" value="{{ user_name }}" maxlength="80" required><label>Registered email</label><input value="{{ email }}" readonly><label>Phone number</label><input value="{{ phone }}" readonly><label>Country</label><input value="{{ country }}" readonly><button type="submit">Save profile</button></form><p><a class="btn" href="/wallet">Open wallet</a></p></section></main></body></html>
