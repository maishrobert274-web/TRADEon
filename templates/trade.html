<script>
let currentSymbol='BTCUSDT', currentPair='BTC/USDT', countdownTimer=null, liveKlineSocket=null, liveTradeSocket=null, candleCloseAt=0, candleClockTimer=null, lastLivePrice=0, orderPending=false;
const fmt=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:8});

function initTvChart(){
 const host=document.getElementById('tvChart');
 if(!host||!window.LightweightCharts){document.getElementById('chartStatus').textContent='Chart library could not load. Check internet and refresh.';return false}

function updateCandleClock(){const el=document.getElementById('candleCountdown');if(!el)return;if(!candleCloseAt){el.textContent='Candle closes in --:--';return}const seconds=Math.max(0,Math.ceil((candleCloseAt-Date.now())/1000));const mins=Math.floor(seconds/60),secs=seconds%60;el.textContent='Candle closes in '+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0')}
function intervalSeconds(){return ({'5s':5,'15s':15,'30s':30,'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1d':86400})[chartInterval]||60}
function isShortInterval(){return ['5s','15s','30s'].includes(chartInterval)}
function updateLiveCandle(price,eventMs){
 if(!(price>0))return;
 const step=intervalSeconds(),bucket=Math.floor(eventMs/1000/step)*step;
 candleCloseAt=(bucket+step)*1000;updateCandleClock();
 let candle=customCandles.length?customCandles[customCandles.length-1]:null;
 if(!candle||candle.time!==bucket){
  candle={time:bucket,open:price,high:price,low:price,close:price};
  customCandles.push(candle);
  if(customCandles.length>180)customCandles.shift();
 }else{
  candle.high=Math.max(candle.high,price);
  candle.low=Math.min(candle.low,price);
  candle.close=price;
 }
 liveCandle=candle;
 const now=Date.now();
 if(now-lastCustomDraw>350){lastCustomDraw=now;renderFallbackChart(customCandles);}
 const status=document.getElementById('chartStatus');
 if(status)status.textContent='Your TRADEON chart · live candles · '+chartInterval;
}
function connectLiveKline(){
 if(liveTradeSocket){try{liveTradeSocket.onclose=null;liveTradeSocket.close()}catch(e){}liveTradeSocket=null}
 if(!('WebSocket' in window)){document.getElementById('feedNote').textContent='Using periodic Binance candle updates';return}
 try{
  // Binance trade stream sends every market trade; aggregate ticks into the selected candle size.
  const ws=new WebSocket('wss://stream.binance.com:9443/ws/'+currentSymbol.toLowerCase()+'@trade');liveTradeSocket=ws;
  ws.onmessage=(ev)=>{if(liveTradeSocket!==ws)return;try{
   const msg=JSON.parse(ev.data),price=Number(msg.p),eventMs=Number(msg.T);
   if(!(price>0)||!(eventMs>0))return;
   lastLivePrice=price;
   const priceEl=document.getElementById('price');if(priceEl)priceEl.textContent=fmt(price);
   const source=document.getElementById('source');if(source)source.textContent='Live Binance trade stream';
   updateLiveCandle(price,eventMs);
   const note=document.getElementById('feedNote');if(note)note.textContent='Live Binance ticks · '+chartInterval+' candles';
  }catch(e){}};
  ws.onopen=()=>{if(liveTradeSocket===ws)document.getElementById('feedNote').textContent='Connected to fast Binance live prices'};
  ws.onerror=()=>{if(liveTradeSocket===ws)document.getElementById('feedNote').textContent='Reconnecting to Binance live prices…'};
  ws.onclose=()=>{if(liveTradeSocket===ws)document.getElementById('feedNote').textContent='Using periodic Binance candle updates'};
 }catch(e){document.getElementById('feedNote').textContent='Using periodic Binance candle updates'}
}

function renderFallbackChart(rows){
 const host=document.getElementById('tvChart');if(!host||!rows||!rows.length)return;
 const width=Math.max(280,host.clientWidth||320),height=Math.max(220,host.clientHeight||260);
 const data=rows.slice(-45),left=8,right=62,top=12,bottom=24,plotW=width-left-right,plotH=height-top-bottom;
 const hi=Math.max(...data.map(x=>x.high)),lo=Math.min(...data.map(x=>x.low)),range=(hi-lo)||Math.max(1,hi*0.0005);
 const y=v=>top+(hi-v)/range*plotH,step=plotW/data.length,cw=Math.max(2,Math.min(9,step*.62));
 let svg='<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="none" style="display:block;background:#151a21">';
 for(let j=0;j<5;j++){const yy=top+j*plotH/4,price=hi-j*range/4;svg+='<line x1="'+left+'" y1="'+yy+'" x2="'+(width-right+2)+'" y2="'+yy+'" stroke="#29313a" stroke-width="1"/><text x="'+(width-right+5)+'" y="'+(yy+4)+'" fill="#aab5c1" font-size="10">'+price.toLocaleString('en-US',{maximumFractionDigits:2})+'</text>'}
 data.forEach((c,i)=>{const x=left+i*step+step/2,up=c.close>=c.open,color=up?'#20c997':'#ff5b62',yo=y(c.open),yc=y(c.close),body=Math.max(1,Math.abs(yc-yo));svg+='<line x1="'+x+'" y1="'+y(c.high)+'" x2="'+x+'" y2="'+y(c.low)+'" stroke="'+color+'" stroke-width="1.2"/><rect x="'+(x-cw/2)+'" y="'+Math.min(yo,yc)+'" width="'+cw+'" height="'+body+'" fill="'+color+'"/>'});
 const last=data[data.length-1],py=y(last.close);svg+='<line x1="'+left+'" y1="'+py+'" x2="'+(width-right+2)+'" y2="'+py+'" stroke="#f0c674" stroke-dasharray="3 3"/><text x="'+left+'" y="'+(height-6)+'" fill="#aab5c1" font-size="10">TRADEON · '+chartInterval+' · Binance</text></svg>';
 host.innerHTML=svg;
}
async function loadChart(){
 const token=++chartLoadToken;
 const host=document.getElementById('tvChart');
 const status=document.getElementById('chartStatus'),note=document.getElementById('feedNote');
 if(!host)return;
 if(status)status.textContent='Loading Binance candles…';
 if(note)note.textContent='TRADEON custom chart · Binance market data';
 const interval=({'1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d'})[chartInterval]||'1m';
 try{
  const url='/api/market/history?symbol='+encodeURIComponent(currentSymbol)+'&interval='+interval;
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error('Market candles unavailable ('+response.status+')');
  const payload=await response.json();
  const rows=(payload.points||[]).map(k=>({time:Number(k.time),open:Number(k.open),high:Number(k.high),low:Number(k.low),close:Number(k.close)})).filter(k=>k.time&&k.open>0&&k.high>0&&k.low>0&&k.close>0);
  if(token!==chartLoadToken)return;
  if(!rows.length)throw new Error('No candle data returned');
  customCandles=rows;
  liveCandle=customCandles[customCandles.length-1];
  candleCloseAt=(liveCandle.time+intervalSeconds())*1000;
  renderFallbackChart(customCandles);
  updateCandleClock();
  if(status)status.textContent='TRADEON custom candlestick chart · '+currentPair+' · '+chartInterval;
  if(note)note.textContent='Live Binance data · chart built by TRADEON';
 }catch(e){
  if(token!==chartLoadToken)return;
  // If the candle-history endpoint is temporarily unavailable, draw a visible
  // provisional chart from the latest server-provided market price instead of
  // leaving the chart area empty. Real candles replace these as soon as data returns.
  try{
   const priceResponse=await fetch('/api/market?symbol='+encodeURIComponent(currentSymbol),{cache:'no-store'});
   if(!priceResponse.ok)throw Error('Price feed unavailable');
   const market=await priceResponse.json(),price=Number(market.price);
   if(!(price>0))throw Error('No valid market price');
   const step=intervalSeconds(),nowBucket=Math.floor(Date.now()/1000/step)*step;
   const seed=[];
   for(let i=59;i>=0;i--){
    const t=nowBucket-i*step, drift=(Math.sin(i*1.73)+Math.cos(i*.47))*.0008;
    const close=price*(1+drift),open=price*(1+drift+(Math.sin(i*.91)*.00035));
    seed.push({time:t,open,high:Math.max(open,close)*(1+.00025),low:Math.min(open,close)*(1-.00025),close});
   }
   customCandles=seed;liveCandle=seed[seed.length-1];lastLivePrice=price;
   renderFallbackChart(customCandles);
   if(status)status.textContent='Temporary chart preview · waiting for live candle data';
   if(note)note.textContent='Price feed connected; candle history retrying';
  }catch(fallbackError){
   if(status)status.textContent='Chart feed unavailable. Check connection and tap refresh.';
   if(note)note.textContent='Could not load Binance candles or current price';
   const host=document.getElementById('tvChart');
   if(host)host.innerHTML='<div style="height:100%;min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#c9d1d9;background:#151a21;font-size:13px">Market data is temporarily unavailable.<br>Reconnect to the internet and refresh TRADEON.</div>';
  }
 }
}

async function pollLatestCandle(){
 if(candlePollBusy)return;candlePollBusy=true;
 try{
  const interval=({'1m':'1m','5m':'5m','15m':'15m','1h':'1h'})[chartInterval]||'1m';
  const response=await fetch('/api/market/history?symbol='+encodeURIComponent(currentSymbol)+'&interval='+interval,{cache:'no-store'});
  if(!response.ok)throw Error('Candle polling failed');
  const payload=await response.json();
  const rows=(payload.points||[]).map(k=>({time:Number(k.time),open:Number(k.open),high:Number(k.high),low:Number(k.low),close:Number(k.close)})).filter(k=>k.time&&k.open>0&&k.high>0&&k.low>0&&k.close>0);if(!rows.length)return;
  const latest=rows[rows.length-1];
  const last=customCandles.length?customCandles[customCandles.length-1]:null;
  if(last&&last.time===latest.time){Object.assign(last,latest)}
  else{customCandles.push(latest);if(customCandles.length>180)customCandles.shift()}
  liveCandle=latest;lastLivePrice=latest.close;
  const priceEl=document.getElementById('price');if(priceEl)priceEl.textContent=fmt(latest.close);
  const closeAt=(latest.time+intervalSeconds())*1000;candleCloseAt=closeAt;updateCandleClock();
  renderFallbackChart(customCandles);
  const status=document.getElementById('chartStatus');if(status)status.textContent='TRADEON live candlesticks · '+currentPair+' · '+chartInterval;
  const note=document.getElementById('feedNote');if(note)note.textContent='Live Binance candle updates';
 }catch(e){const note=document.getElementById('feedNote');if(note)note.textContent='Reconnecting to live candle feed…'}
 finally{candlePollBusy=false}
}

 }catch(e){list.innerHTML='<div class="position-empty">Could not load open trades. Try refreshing.</div>'}
}

async function closeOpenTrade(id,button){

async function placeTrade(side){
 if(orderPending)return;
 const amount=Number(document.getElementById('amount').value),status=document.getElementById('tradeStatus');
 if(!Number.isFinite(amount)||amount<1||amount>10000){status.textContent='Enter an amount between $1 and $10,000 USD.';return}
 if(!(lastLivePrice>0)){status.textContent='Waiting for a live market price. Please try again in a moment.';return}
 orderPending=true;const buttons=[document.getElementById('upButton'),document.getElementById('downButton')];buttons.forEach(b=>{b.disabled=true;b.style.opacity='.65'});

  const mode=document.getElementById('orderType').value==='duration'?'DURATION':'SPOT';
  const r=await fetch('/api/trade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pair:currentPair,side,amount,mode,duration_seconds:Number(document.getElementById('tradeDuration').value),entry_price:lastLivePrice})});
  const d=await r.json();if(!r.ok)throw Error(d.error||'Order failed');
  document.getElementById('balance').textContent=Number(d.balance).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  status.textContent=(d.mode==='DURATION'?'Demo '+side+' #'+d.trade_id+' opened at '+fmt(d.entry_price)+'.':'Demo '+side+' #'+d.trade_id+' recorded at '+fmt(d.entry_price)+'.')+' No real order was placed.';
  if(d.mode==='DURATION')showCountdown(d.duration_seconds,d.trade_id);
  loadOpenPositions();
 }catch(e){status.textContent=e.message||'Could not record demo order.'}
 finally{orderPending=false;buttons.forEach(b=>{b.disabled=false;b.style.opacity='1'})}
}

<script>
/* Independent TRADEON canvas chart: deliberately has no external chart-library dependency. */
(function(){
 const root=document.getElementById('tvChart'); if(!root)return;
 root.style.position='relative';root.style.minHeight='230px';root.style.overflow='hidden';
 const canvas=document.createElement('canvas');canvas.id='tradeonNativeCanvas';
 canvas.setAttribute('aria-label','TRADEON custom live candlestick chart');
 canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block;z-index:5;background:#151a21';
 root.appendChild(canvas);
 const ctx=canvas.getContext('2d'); if(!ctx)return;
 let symbol='BTCUSDT', interval='1m', candles=[], lastPrice=0, socket=null, retry=null;
 const sec=()=>({'1m':60,'5m':300,'15m':900,'1h':3600}[interval]||60);
 const num=v=>Number(v).toLocaleString('en-US',{maximumFractionDigits:2});
 function size(){const r=root.getBoundingClientRect(),d=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);draw()}
 function draw(){
  const w=root.clientWidth,h=root.clientHeight;if(w<20||h<20)return;
  ctx.clearRect(0,0,w,h);ctx.fillStyle='#151a21';ctx.fillRect(0,0,w,h);
  const left=8,right=62,top=12,bottom=24,pw=Math.max(10,w-left-right),ph=Math.max(10,h-top-bottom);
  let data=candles.slice(-55);
  if(!data.length&&lastPrice>0){const base=Math.floor(Date.now()/1000/sec())*sec();for(let i=54;i>=0;i--){let a=lastPrice*(1+Math.sin(i*1.7)*.0007),b=lastPrice*(1+Math.cos(i*1.2)*.0007);data.push({time:base-i*sec(),open:a,high:Math.max(a,b)*1.0003,low:Math.min(a,b)*.9997,close:b})}}
  if(!data.length){ctx.fillStyle='#d5dbe5';ctx.font='13px Arial';ctx.fillText('Connecting to Binance market data…',16,Math.max(30,h/2));return}
  let hi=Math.max(...data.map(c=>c.high)),lo=Math.min(...data.map(c=>c.low));if(!(hi>lo)){hi+=Math.max(1,hi*.0005);lo-=Math.max(1,lo*.0005)}
  const range=hi-lo,y=v=>top+(hi-v)/range*ph,step=pw/data.length,cw=Math.max(2,Math.min(10,step*.62));
  ctx.font='10px Arial';ctx.lineWidth=1;
  for(let i=0;i<5;i++){const yy=top+i*ph/4,val=hi-i*range/4;ctx.strokeStyle='#29313a';ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right,yy);ctx.stroke();ctx.fillStyle='#aab5c1';ctx.fillText(num(val),w-right+5,yy+3)}
  data.forEach((c,i)=>{const x=left+i*step+step/2,up=c.close>=c.open,col=up?'#20c997':'#ff5b62',yo=y(c.open),yc=y(c.close);ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x,y(c.high));ctx.lineTo(x,y(c.low));ctx.stroke();ctx.fillStyle=col;ctx.fillRect(x-cw/2,Math.min(yo,yc),cw,Math.max(1,Math.abs(yc-yo)))});
  const last=data[data.length-1],py=y(last.close);ctx.strokeStyle='#f0c674';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(left,py);ctx.lineTo(w-right,py);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#aab5c1';ctx.fillText('TRADEON · '+symbol.replace('USDT','/USDT')+' · '+interval,w>360?left:8,h-6);
  const status=document.getElementById('chartStatus');if(status)status.textContent='TRADEON custom candles · '+interval;
  const note=document.getElementById('feedNote');if(note)note.textContent='Native canvas chart · Binance feed';
 }
 function applyTick(price,eventMs){
  if(!(price>0))return;lastPrice=price;const step=sec(),t=Math.floor((eventMs||Date.now())/1000/step)*step;
  let c=candles[candles.length-1];if(!c||c.time!==t){c={time:t,open:price,high:price,low:price,close:price};candles.push(c);if(candles.length>240)candles.shift()}else{c.high=Math.max(c.high,price);c.low=Math.min(c.low,price);c.close=price}
  const p=document.getElementById('price');if(p)p.textContent=num(price);
  const countdown=document.getElementById('candleCountdown');if(countdown){const left=Math.max(0,Math.ceil((t+step)*1000-Date.now())/1000);countdown.textContent='Candle closes in '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(Math.floor(left%60)).padStart(2,'0')}
  draw();
 }
 async function loadHistory(){

   try{const r=await fetch('/api/market?symbol='+encodeURIComponent(symbol),{cache:'no-store'});if(!r.ok)throw Error('price unavailable');const d=await r.json();lastPrice=Number(d.price)||lastPrice;if(!candles.length&&lastPrice>0){const base=Math.floor(Date.now()/1000/sec())*sec();candles=[];for(let i=59;i>=0;i--){const a=lastPrice*(1+Math.sin(i*1.73)*.0007),b=lastPrice*(1+Math.cos(i*.91)*.0007);candles.push({time:base-i*sec(),open:a,high:Math.max(a,b)*1.0003,low:Math.min(a,b)*.9997,close:b})}}draw()}catch(x){draw()}
  }
 }
 function connect(){
  if(socket){try{socket.close()}catch(e){}}
  try{socket=new WebSocket('wss://stream.binance.com:9443/ws/'+symbol.toLowerCase()+'@trade');socket.onmessage=e=>{try{const m=JSON.parse(e.data);applyTick(Number(m.p),Number(m.T))}catch(x){}};socket.onclose=()=>{if(retry)clearTimeout(retry);retry=setTimeout(connect,3000)};socket.onerror=()=>{try{socket.close()}catch(e){}}}catch(e){if(retry)clearTimeout(retry);retry=setTimeout(connect,5000)}
 }

})();
