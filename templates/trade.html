.open-positions{max-width:1000px;margin:-78px auto 100px;padding:10px 12px;background:#151a21;border:1px solid #29313a;border-radius:10px}.positions-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}.positions-heading a{color:#20c997;font-size:11px;text-decoration:none}.position-heading-actions{display:flex;align-items:center;gap:8px}.close-position:disabled{opacity:.6}.positions-list{display:grid;gap:6px}.position-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:#0e1319;border:1px solid #29313a;border-radius:8px;padding:8px;font-size:11px}.position-meta{color:#9aa5b1;line-height:1.5}.close-position{border:0;background:#d64545;color:#fff;border-radius:6px;padding:8px 10px;font-size:11px;font-weight:800}.position-empty{color:#9aa5b1;font-size:11px;padding:5px 0}.close-position:disabled{opacity:.6}@media(max-width:800px){.open-positions{margin:-84px 4px 100px;padding:8px}.position-row{grid-template-columns:1fr auto;gap:5px}.position-meta{grid-column:1/2}.close-position{grid-column:2;grid-row:1/3;padding:8px}}.below-actions{max-width:1000px;margin:0 auto 90px;padding:8px 12px;background:#151a21;border:1px solid #29313a;border-radius:10px;display:grid;grid-template-columns:minmax(120px,1fr) minmax(180px,1.5fr);gap:8px;align-items:center}.trade-amount{display:grid;grid-template-columns:1fr;gap:3px}.trade-amount .label{margin:3px 0}.below-actions .actions{margin:0;gap:8px}.below-actions .actions button{padding:14px 6px}.below-actions .status{grid-column:1/-1;margin:0;min-height:0}.below-actions .duration,.below-actions .amount{padding:8px;font-size:13px}.below-actions .presets{margin:3px 0}.below-actions .presets button{padding:5px}.panel{padding:10px}.panel .label,.panel .amount,.panel .presets,.panel #orderType,.panel #durationBox,.panel .actions{display:none!important}.panel .demoTag{margin-bottom:4px}.panel h2{margin:0 0 4px}.panel .muted{font-size:10px}.chart{height:clamp(160px,34vh,330px)}@media(max-width:800px){html,body{min-height:100%;}.top{height:44px;padding:0 8px}.brand{font-size:18px}.balance{padding:6px 8px;font-size:11px}.wrap{grid-template-columns:1fr;gap:5px;padding:5px}.below-actions{grid-template-columns:minmax(0,1fr);gap:5px;padding:6px}.below-actions .actions button{padding:12px 4px}.trade-amount{grid-template-columns:1fr 1fr;column-gap:6px}.trade-amount>label[for="amount"],.trade-amount>#amount,.trade-amount>.presets{grid-column:1/-1}.trade-amount>label[for="orderType"],.trade-amount>#orderType{grid-column:auto}.chart{height:clamp(150px,29vh,240px)}.wrap>section,.wrap>aside{min-width:0}.marketbar{gap:4px;padding:6px}.pair{padding:7px 5px;font-size:10px;min-width:0}.pricehead{padding:8px;gap:4px}.symbol{font-size:13px}.price{font-size:16px;margin-top:4px}.muted{font-size:10px}.change{font-size:11px}.chart{height:75vh;min-height:420px;max-height:none;padding:4px}.chartfoot{padding:5px 8px;font-size:9px}.chart-controls{padding:0 5px 6px}.chart-types,.timeframes{gap:3px}.chart-types button,.timeframes button{padding:5px 4px;font-size:9px}.panel{padding:8px}.demoTag{font-size:9px;padding:4px 5px;margin-bottom:6px}.panel h2{font-size:13px}.panel .muted{font-size:9px;line-height:1.3}.label{font-size:10px;margin:8px 0 4px}.amount,.duration{padding:8px 6px;font-size:12px}.presets{gap:3px;margin-top:4px}.presets button{padding:6px 1px;font-size:10px}.actions{gap:5px;margin-top:10px}.actions button{padding:10px 2px;font-size:11px}.status{font-size:9px;line-height:1.3;margin-top:6px;min-height:0}.shortcut-grid{gap:5px;padding:6px}.shortcut{flex-direction:column;gap:3px;min-height:48px;padding:5px 2px;font-size:10px;text-align:center}.shortcut-icon{font-size:15px}.disclaimer{padding:0 8px 90px;font-size:9px}}@media(max-width:390px){.wrap{grid-template-columns:1fr;gap:4px;padding:4px}.marketbar{gap:2px}.pair{font-size:9px;padding:6px 3px}.price{font-size:14px}.panel{padding:6px}.panel h2{font-size:12px}.shortcut{font-size:9px}}

@media(max-width:800px){
  .chart{height:42vh!important;min-height:230px!important;max-height:360px!important;padding:4px!important}
  .chart #tvChart{height:100%!important;min-height:0!important}
  .below-actions{display:grid!important;position:relative;margin:6px 4px 12px!important;padding:8px!important}
  .trade-amount{display:grid!important}
  .below-actions .actions{display:grid!important}
  .below-actions .actions button{display:block!important}

 .top{height:auto;min-height:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:7px;padding:8px 10px;background:#151a21}
 .top>.brand{width:100%;font-size:19px;line-height:1.2}
 .top>div:last-child{width:100%;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;flex-wrap:nowrap!important}
 .top .navlinks{order:0;display:flex;gap:6px;align-items:center;flex:1}

<body>
<header class="top"><div class="brand">TRADE<span>ON</span></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end"><div class="navlinks"><a class="account-btn wallet-btn" href="/wallet">Wallet</a><a class="account-btn profile-btn" href="/profile">Profile</a></div><div class="balance">DEMO USD $<span id="balance">{{ "%.2f"|format(demo_balance) }}</span></div></div></header>



<main class="wrap">
<section>
<div class="card">
<div class="marketbar" id="marketList"><button class="pair active" data-pair="BTC/USDT" data-symbol="BTCUSDT" onclick="choosePair(this)">BTC/USDT</button><button class="pair" data-pair="ETH/USDT" data-symbol="ETHUSDT" onclick="choosePair(this)">ETH/USDT</button><button class="pair" data-pair="SOL/USDT" data-symbol="SOLUSDT" onclick="choosePair(this)">SOL/USDT</button></div>
<div class="pricehead"><div><div class="symbol" id="symbol">BTC/USDT</div><div class="price" id="price">Loading price…</div></div><div style="text-align:right"><div class="change" id="change">--</div><div class="muted" id="source">Getting market data</div></div></div>
<div class="chart" style="padding:0;overflow:hidden"><div id="tvChart" role="img" aria-label="Live candlestick market chart with demo trade entry lines" style="width:100%;height:100%;min-height:220px;display:block"></div></div>
<div class="chartfoot"><span id="chartStatus">Loading market candles…</span><span id="candleCountdown">Candle closes in --:--</span><span id="feedNote">Market feed</span></div>
<div class="chart-controls"><div class="timeframes"><span style="align-self:center;color:#9aa5b1;font-size:11px;padding:0 5px">CANDLE SIZE</span><button class="selected" data-interval="1m" onclick="setIntervalChoice('1m',this)">1 min</button><button data-interval="5m" onclick="setIntervalChoice('5m',this)">5 min</button><button data-interval="15m" onclick="setIntervalChoice('15m',this)">15 min</button><button data-interval="1h" onclick="setIntervalChoice('1h',this)">1 hour</button></div></div>
</div>

</section>



</main>
<section class="below-actions"><div class="trade-amount"><label class="label" for="amount">Amount (USD $)</label><input id="amount" class="amount" type="number" min="10" max="10000" step="10" value="100"><div class="presets"><button type="button" onclick="setAmount(100)">100</button><button type="button" onclick="setAmount(500)">500</button><button type="button" onclick="setAmount(1000)">1,000</button></div><label class="label" for="orderType">Mode</label><select id="orderType" class="duration" onchange="updateTradeMode()"><option value="spot">Spot</option><option value="duration">Fixed time</option></select><div id="durationBox" hidden><label class="label" for="tradeDuration">Expiry</label><select id="tradeDuration" class="duration"><option value="15">15 seconds</option><option value="30">30 seconds</option><option value="60">1 minute</option></select></div></div><div class="actions"><button class="buy" id="upButton" onclick="placeTrade(document.getElementById('orderType').value==='duration'?'UP':'BUY')">BUY / UP</button><button class="sell" id="downButton" onclick="placeTrade(document.getElementById('orderType').value==='duration'?'DOWN':'SELL')">SELL / DOWN</button></div><div id="tradeStatus" class="status">Demo trading only. No real order is placed.</div><div id="tradeCountdown" class="status" aria-live="polite"></div></section>


<nav class="shortcut-grid" aria-label="Main sections">
<a class="shortcut" href="/trades"><span class="shortcut-icon">↔</span><span>Trades</span></a>
<a class="shortcut" href="/signals"><span class="shortcut-icon">◈</span><span>Insights</span></a>
<a class="shortcut" href="/trade"><span class="shortcut-icon">⌁</span><span>Buy/Sell</span></a>
<a class="shortcut" href="/social-trading"><span class="shortcut-icon">◎</span><span>Social Trading</span></a>
<a class="shortcut" href="/deposit"><span class="shortcut-icon">＋</span><span>Deposit</span></a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js" onerror="this.onerror=null;this.src='https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js'"></script>
<script>
let currentSymbol='BTCUSDT', currentPair='BTC/USDT', countdownTimer=null, liveKlineSocket=null, liveTradeSocket=null, candleCloseAt=0, candleClockTimer=null, lastLivePrice=0, orderPending=false;
const fmt=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:8});
function setAmount(n){document.getElementById('amount').value=n}
function filterMarkets(q){const query=q.trim().toLowerCase();document.querySelectorAll("#marketList .pair").forEach(b=>{b.hidden=!b.dataset.pair.toLowerCase().includes(query)})}
function selectPlatformMode(mode,button){document.querySelectorAll('.platform-nav .nav-tab').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');const selector=document.getElementById('orderType');if(mode==='fixed'){selector.value='duration'}else{selector.value='spot'}updateTradeMode();document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('tradeStatus').textContent=mode==='pro'?'Pro layout selected. Advanced chart tools are being developed; trading remains demo-only.':mode==='classic'?'Classic demo Buy/Sell mode selected.':'Fixed Time demo mode selected. Choose an expiry and amount.'}
function toggleMore(){const m=document.getElementById('moreMenu');m.hidden=!m.hidden}
function updateTradeMode(){const duration=document.getElementById('orderType').value==='duration';document.getElementById('durationBox').hidden=!duration;document.getElementById('upButton').textContent=duration?'UP':'BUY';document.getElementById('downButton').textContent=duration?'DOWN':'SELL';document.getElementById('tradeStatus').textContent=duration?'Short-duration demo trades settle after the selected timer.':'Spot mode is simulated; no exchange order is placed.'}
function showCountdown(seconds,tradeId){if(countdownTimer)clearInterval(countdownTimer);const el=document.getElementById('tradeCountdown');let end=Date.now()+seconds*1000;function tick(){const left=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=left>0?'Position #'+tradeId+' expires in '+left+'s':'Expiry reached — checking result…';if(left<=0)clearInterval(countdownTimer)}tick();countdownTimer=setInterval(tick,250)}
async function settleDue(){try{const r=await fetch('/api/trades/settle-due',{method:'POST'});if(r.ok){const d=await r.json();if(d.settled&&d.settled.length){document.getElementById('tradeStatus').textContent=d.settled.map(t=>'Trade #'+t.trade_id+': '+(t.won?'WIN':'LOSS')+' · demo P/L $'+Number(t.pnl).toFixed(2)).join(' | ');location.reload()}}}catch(e){}}
function choosePair(button){currentSymbol=button.dataset.symbol;currentPair=button.dataset.pair;document.getElementById('symbol').textContent=currentPair;document.querySelectorAll('.pair').forEach(b=>b.classList.toggle('active',b===button));liveShortCandles=[];liveCandle=null;shortChartReady=false;loadPrice();loadChart();connectLiveKline()}
async function loadPrice(){const p=document.getElementById('price'),ch=document.getElementById('change'),src=document.getElementById('source');try{const r=await fetch('/api/market?symbol='+encodeURIComponent(currentSymbol));const d=await r.json();if(!r.ok)throw Error(d.error||'unavailable');lastLivePrice=Number(d.price)||lastLivePrice;p.textContent=fmt(d.price);ch.textContent=(d.change_percent>=0?'+':'')+Number(d.change_percent).toFixed(2)+'%';ch.style.color=d.change_percent>=0?'#27d99a':'#ff6b6b';src.textContent='Source: '+(d.source||'market data')}catch(e){p.textContent='Price unavailable';ch.textContent='--';src.textContent='Market feed temporarily unavailable'}}
let chartType='candles', chartInterval='1m', tvChart=null, tvSeries=null, tvResizeObserver=null, chartBusy=false, liveCandle=null, liveShortCandles=[], shortChartReady=false, tradePriceLines=[];
document.querySelectorAll('.chart-types button').forEach(b=>b.classList.toggle('selected',b.dataset.chart==='candles'));
function initTvChart(){
 const host=document.getElementById('tvChart');
 if(!host||!window.LightweightCharts){document.getElementById('chartStatus').textContent='Chart library could not load. Check internet and refresh.';return false}
 if(tvChart)return true;
 const L=window.LightweightCharts;
 tvChart=L.createChart(host,{width:Math.max(280,host.clientWidth),height:Math.max(220,host.clientHeight),layout:{background:{type:'solid',color:'#151a21'},textColor:'#c9d1d9'},grid:{vertLines:{color:'#222a33'},horzLines:{color:'#222a33'}},rightPriceScale:{borderColor:'#303b48'},timeScale:{borderColor:'#303b48',timeVisible:true,secondsVisible:true},crosshair:{mode:L.CrosshairMode.Normal},handleScroll:true,handleScale:true});
 setSeriesType('candles');
 if(window.ResizeObserver){tvResizeObserver=new ResizeObserver(()=>{if(tvChart)tvChart.applyOptions({width:Math.max(280,host.clientWidth),height:Math.max(260,host.clientHeight)})});tvResizeObserver.observe(host)}
 return true;
}
function setSeriesType(type){
 if(!initTvChart())return;
 const L=window.LightweightCharts;
 if(tvSeries){tradePriceLines=[];tvChart.removeSeries(tvSeries);tvSeries=null}
 chartType=type;
 if(type==='line')tvSeries=tvChart.addSeries(L.LineSeries,{color:'#20c997',lineWidth:2,priceLineVisible:true});
 else if(type==='area')tvSeries=tvChart.addSeries(L.AreaSeries,{lineColor:'#20c997',topColor:'rgba(32,201,151,0.28)',bottomColor:'rgba(32,201,151,0.02)',lineWidth:2});
 else if(type==='bars')tvSeries=tvChart.addSeries(L.BarSeries,{upColor:'#20c997',downColor:'#ff5b62'});
 else tvSeries=tvChart.addSeries(L.CandlestickSeries,{upColor:'#20c997',downColor:'#ff5b62',borderUpColor:'#20c997',borderDownColor:'#ff5b62',wickUpColor:'#20c997',wickDownColor:'#ff5b62'});
}
function setChartType(type,button){chartType=type;document.querySelectorAll('.chart-types button').forEach(b=>b.classList.toggle('selected',b.dataset.chart===type));setSeriesType(type);loadChart()}
function setIntervalChoice(interval,button){chartInterval=interval;document.querySelectorAll('.timeframes button').forEach(b=>b.classList.toggle('selected',b.dataset.interval===interval));liveShortCandles=[];liveCandle=null;shortChartReady=false;loadChart();connectLiveKline()}
async function fetchChartWithTimeout(url,ms=5000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),ms);try{return await fetch(url,{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timer)}}

function updateCandleClock(){const el=document.getElementById('candleCountdown');if(!el)return;if(!candleCloseAt){el.textContent='Candle closes in --:--';return}const seconds=Math.max(0,Math.ceil((candleCloseAt-Date.now())/1000));const mins=Math.floor(seconds/60),secs=seconds%60;el.textContent='Candle closes in '+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0')}
function intervalSeconds(){return ({'5s':5,'15s':15,'30s':30,'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1d':86400})[chartInterval]||60}
function isShortInterval(){return ['5s','15s','30s'].includes(chartInterval)}
function updateLiveCandle(price,eventMs){
 if(!tvSeries||!(price>0))return;
 const step=intervalSeconds(),bucket=Math.floor(eventMs/1000/step)*step;
 if(isShortInterval()){candleCloseAt=(bucket+step)*1000;updateCandleClock();document.getElementById('chartStatus').textContent='Live candle updating · '+chartInterval;
  let candle=liveShortCandles.length?liveShortCandles[liveShortCandles.length-1]:null;
  if(!candle||candle.time!==bucket){candle={time:bucket,open:price,high:price,low:price,close:price};liveShortCandles.push(candle);if(liveShortCandles.length>180)liveShortCandles.shift();}
  else{candle.high=Math.max(candle.high,price);candle.low=Math.min(candle.low,price);candle.close=price;}
  liveCandle=candle;
  const rows=(chartType==='line'||chartType==='area')?liveShortCandles.map(x=>({time:x.time,value:x.close})):liveShortCandles;
  try{tvSeries.setData(rows);tvChart.timeScale().scrollToRealTime()}catch(e){}
 }else{
  if(!liveCandle||liveCandle.time!==bucket){liveCandle={time:bucket,open:price,high:price,low:price,close:price};}
  else{liveCandle={time:bucket,open:liveCandle.open,high:Math.max(liveCandle.high,price),low:Math.min(liveCandle.low,price),close:price};}
  try{if(chartType==='line'||chartType==='area')tvSeries.update({time:bucket,value:price});else tvSeries.update(liveCandle)}catch(e){}
 }
}
function connectLiveKline(){
 if(liveTradeSocket){try{liveTradeSocket.onclose=null;liveTradeSocket.close()}catch(e){}liveTradeSocket=null}
 if(!('WebSocket' in window)){document.getElementById('feedNote').textContent='Price feed unavailable';return}
 try{
  const ts=new WebSocket('wss://stream.binance.com:9443/ws/'+currentSymbol.toLowerCase()+'@trade');liveTradeSocket=ts;
  ts.onmessage=(ev)=>{if(liveTradeSocket!==ts)return;try{const d=JSON.parse(ev.data),price=Number(d.p);if(price>0){lastLivePrice=price;document.getElementById('price').textContent=fmt(price);document.getElementById('source').textContent='Live Binance trade price';updateLiveCandle(price,Number(d.T)||Date.now());}}catch(e){}};
  ts.onopen=()=>{if(liveTradeSocket===ts)document.getElementById('feedNote').textContent='TradingView chart · live price feed';};
  ts.onerror=()=>{if(liveTradeSocket===ts)document.getElementById('feedNote').textContent='Live price feed reconnecting…'};
 }catch(e){document.getElementById('feedNote').textContent='Live price feed unavailable'}
}

let lastChartViewKey='';
function refreshTradePriceLines(trades){
 if(!tvSeries||!window.LightweightCharts)return;
 for(const line of tradePriceLines){try{tvSeries.removePriceLine(line)}catch(e){}}
 tradePriceLines=[];
 (trades||[]).forEach(tr=>{
  const price=Number(tr.entry_price);if(!(price>0))return;
  const side=String(tr.side||'').toUpperCase();
  const isBuy=side==='BUY'||side==='UP';
  const labelSide=isBuy?'BUY':'SELL';
  const color=isBuy?'#20c997':'#ff5b62';
  const amount=Number(tr.amount||0);
  const placed=tr.created_at?String(tr.created_at).replace('T',' ').slice(0,19):'time unavailable';
  const title=labelSide+' #'+tr.id+' ·  '+placed+' · Entry '+fmt(price);
  try{tradePriceLines.push(tvSeries.createPriceLine({price,color,lineWidth:2,lineStyle:window.LightweightCharts.LineStyle.Solid,axisLabelVisible:true,title}))}catch(e){}
 });
}
function chartRowsFromKlines(rows){
 return rows.map(k=>({time:Math.floor(Number(k[0])/1000),open:Number(k[1]),high:Number(k[2]),low:Number(k[3]),close:Number(k[4])})).filter(k=>k.time&&k.open>0&&k.high>0&&k.low>0&&k.close>0);
}
async function loadChart(){
 if(chartBusy)return;
 if(!initTvChart())return;
 chartBusy=true;
 const status=document.getElementById('chartStatus'),note=document.getElementById('feedNote');
 try{
  const url='https://api.binance.com/api/v3/klines?symbol='+encodeURIComponent(currentSymbol)+'&interval='+encodeURIComponent(chartInterval)+'&limit=240';
  const response=await fetchChartWithTimeout(url,9000);
  if(!response.ok)throw Error('Market candle request failed');
  const rows=chartRowsFromKlines(await response.json());
  if(!rows.length)throw Error('No market candles returned');
  liveShortCandles=rows.slice();liveCandle=rows[rows.length-1];
  const chartData=(chartType==='line'||chartType==='area')?rows.map(k=>({time:k.time,value:k.close})):rows;
  tvSeries.setData(chartData);
  tvChart.timeScale().fitContent();
  candleCloseAt=(rows[rows.length-1].time+intervalSeconds())*1000;updateCandleClock();
  if(status)status.textContent='Live Binance candlesticks · '+currentPair+' · '+chartInterval;
  if(note)note.textContent='Live market · trade lines';
  try{const tr=await fetch('/api/trades/open',{cache:'no-store'});if(tr.ok){const data=await tr.json();refreshTradePriceLines(data.trades||[]);}}catch(e){}
 }catch(e){
  if(status)status.textContent='Market candles unavailable. Check connection and refresh.';
  if(note)note.textContent='Waiting for live market candles';
 }finally{chartBusy=false}
}

async function loadOpenPositions(){
 const list=document.getElementById('openPositionsList');if(!list)return;
 try{
  const r=await fetch('/api/trades/open',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load trades');
  if(!d.trades||!d.trades.length){list.innerHTML='<div class="position-empty">No open trades. New demo positions will appear here.</div>';refreshTradePriceLines([]);return}
  list.innerHTML=d.trades.map(tr=>'<div class="position-row"><div><strong>#'+tr.id+' · '+tr.pair+' · '+tr.side+'</strong><div class="position-meta">Amount +' · Entry '+fmt(tr.entry_price)+' · '+tr.mode+'</div></div><button class="close-position" onclick="closeOpenTrade('+tr.id+',this)">CLOSE</button></div>').join('');refreshTradePriceLines(d.trades);
 }catch(e){list.innerHTML='<div class="position-empty">Could not load open trades. Try refreshing.</div>'}
}

async function closeOpenTrade(id,button){
 const note=document.getElementById('closeTradeNotice');button.disabled=true;button.textContent='Closing…';note.textContent='Closing demo trade at the latest available market price…';
 try{
  const r=await fetch('/api/trades/'+id+'/close',{method:'POST'});const d=await r.json();if(!r.ok)throw Error(d.error||'Trade could not be closed');
  note.textContent='Trade #'+id+' closed. Demo P/L: $'+Number(d.pnl).toFixed(2)+'.';
  document.getElementById('balance').textContent=Number(d.balance).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  await loadOpenPositions();
 }catch(e){note.textContent=e.message||'Could not close trade.';button.disabled=false;button.textContent='RETRY'}
}
async function placeTrade(side){
 if(orderPending)return;
 const amount=Number(document.getElementById('amount').value),status=document.getElementById('tradeStatus');
 if(!Number.isFinite(amount)||amount<10||amount>10000){status.textContent='Enter an amount between $10 and $10,000 USD.';return}
 if(!(lastLivePrice>0)){status.textContent='Waiting for a live market price. Please try again in a moment.';return}
 orderPending=true;const buttons=[document.getElementById('upButton'),document.getElementById('downButton')];buttons.forEach(b=>{b.disabled=true;b.style.opacity='.65'});
 status.textContent='Recording demo order…';
 try{
  const mode=document.getElementById('orderType').value==='duration'?'DURATION':'SPOT';
  const r=await fetch('/api/trade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pair:currentPair,side,amount,mode,duration_seconds:Number(document.getElementById('tradeDuration').value),entry_price:lastLivePrice})});
  const d=await r.json();if(!r.ok)throw Error(d.error||'Order failed');
  document.getElementById('balance').textContent=Number(d.balance).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  status.textContent=(d.mode==='DURATION'?'Demo '+side+' #'+d.trade_id+' opened at '+fmt(d.entry_price)+'.':'Demo '+side+' #'+d.trade_id+' recorded at '+fmt(d.entry_price)+'.')+' No real order was placed.';
  if(d.mode==='DURATION')showCountdown(d.duration_seconds,d.trade_id);
  loadOpenPositions();
 }catch(e){status.textContent=e.message||'Could not record demo order.'}
 finally{orderPending=false;buttons.forEach(b=>{b.disabled=false;b.style.opacity='1'})}
}
loadPrice();setTimeout(loadChart,250);setTimeout(connectLiveKline,500);loadOpenPositions();if(!candleClockTimer)candleClockTimer=setInterval(updateCandleClock,250);setInterval(settleDue,2000);setInterval(loadPrice,2000);setInterval(loadChart,60000);setInterval(loadOpenPositions,10000);window.addEventListener('resize',()=>{if(tvChart){const host=document.getElementById('tvChart');tvChart.applyOptions({width:Math.max(280,host.clientWidth),height:Math.max(260,host.clientHeight)})}});
</script>
