name: Build TRADEON Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - "android-apps/**"
      - ".github/workflows/build-android-apps.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build both debug APKs
        working-directory: android-apps
        run: gradle assembleTradeonDebug assembleManagerDebug

      - name: Upload TRADEON APK
        uses: actions/upload-artifact@v4
        with:
          name: TRADEON-APK
          path: android-apps/app/build/outputs/apk/tradeon/debug/app-tradeon-debug.apk
          if-no-files-found: error

      - name: Upload TRADEON Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: TRADEON-Manager-APK
          path: android-apps/app/build/outputs/apk/manager/debug/app-manager-debug.apk
          if-no-files-found: error
